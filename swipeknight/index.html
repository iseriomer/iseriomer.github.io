<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Pixel Dash...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f9fc;
            color: #1a1a1a;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04);
            max-width: 90%;
            width: 320px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        p {
            margin-bottom: 2rem;
            color: #666;
            font-size: 0.95rem;
        }

        a {
            display: inline-block;
            background-color: #2e64e5;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        a:hover {
            background-color: #1c4bba;
        }

        a:active {
            transform: scale(0.98);
        }

        .spinner {
            border: 4px solid rgba(46, 100, 229, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #2e64e5;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Pixel Dash</h1>
        <p>Redirecting to the Google Play Store...</p>
        <a id="play-store-link" href="https://play.google.com/store/apps/details?id=com.pandlebury.pixeldash">Install
            Now</a>
    </div>

    <script>
        // Use the confirmed package ID for SwipeKnight
        const packageId = "com.pandlebury.pixeldash";
        let playStoreUrl = `https://play.google.com/store/apps/details?id=${packageId}`;

        // Get the current query string directly
        const queryString = window.location.search;

        // If there are parameters (like ?level=1-fi0ri), pass them through via the 'referrer' parameter
        if (queryString && queryString.length > 1) {
            const queryParams = queryString.substring(1);
            // encodeURIComponent ensures the query parameters stay intact as a single referrer value
            playStoreUrl += `&referrer=${encodeURIComponent(queryParams)}`;
        }

        // Update the fallback link just in case
        document.getElementById("play-store-link").href = playStoreUrl;

        // Perform the automatic redirection
        // We use replace() so the user doesn't get stuck in a back-button redirect loop
        window.location.replace(playStoreUrl);
    </script>
</body>

</html>
