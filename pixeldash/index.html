<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dash - Joining Game...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0e14;
            color: #ffffff;
        }

        .container {
            text-align: center;
            padding: 2.5rem 2rem;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            width: 340px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #58a6ff;
        }

        p {
            margin-bottom: 1.5rem;
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a.btn {
            display: block;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.15s, opacity 0.15s;
        }

        a.btn-primary {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }

        a.btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }

        a.btn:active {
            transform: scale(0.97);
        }

        .spinner {
            border: 4px solid rgba(88, 166, 255, 0.15);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #58a6ff;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Pixel Dash</h1>
        <p id="status-text">Oyuna bağlanılıyor...</p>
        <div class="btn-group">
            <a id="open-app-btn" class="btn btn-primary" href="#">▶ Oyunu Aç</a>
            <a id="play-store-link" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.pandlebury.pixeldash">Google Play'den İndir</a>
        </div>
    </div>

    <script>
        const packageId = "com.pandlebury.pixeldash";
        let playStoreUrl = `https://play.google.com/store/apps/details?id=${packageId}`;
        const queryString = window.location.search || "";

        if (queryString && queryString.length > 1) {
            const queryParams = queryString.substring(1);
            playStoreUrl += `&referrer=${encodeURIComponent(queryParams)}`;
        }

        document.getElementById("play-store-link").href = playStoreUrl;

        const isAndroid = /Android/i.test(navigator.userAgent);
        const intentUrl = `intent://iseriomer.github.io/pixeldash/${queryString}#Intent;scheme=https;package=${packageId};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
        
        document.getElementById("open-app-btn").href = isAndroid ? intentUrl : playStoreUrl;

        if (isAndroid) {
            window.location.replace(intentUrl);
        } else {
            // On desktop/iOS fallback to Play Store after short pause
            setTimeout(() => {
                window.location.replace(playStoreUrl);
            }, 1200);
        }
    </script>
</body>

</html>
